_target_: rgrl.policies.flow.FlowPolicy
obs_horizon: 2
horizon: 16
n_action_steps: 8
down_dims: [256, 512, 1024]
num_kp: 32
# Opt-in modeling change: share one vision backbone across camera keys.
# This reduces parameters/optimizer state, but is not checkpoint-compatible
# with the default per-camera encoders and should be ablated before rollout.
share_image_encoder: false
# Vision backbone: "resnet18" (torchvision ResNet18 + SpatialSoftmax) or any
# timm model name (e.g. "vit_small_patch14_dinov2.lvd142m"). Pretrained by
# default; image_norm should be "imagenet" whenever the backbone is pretrained.
backbone: resnet18
pretrained_backbone: true
image_norm: imagenet  # unit | neg_one_one | imagenet
vit_img_size: 224  # square size a timm/ViT backbone resizes its input to
frozen_backbone: false
data_transforms:
  - _target_: rgrl.transforms.CropTransform
    _partial_: true  # image_keys, unknown until the store loads, is bound by ObsEncoder
    size: [76, 76]  # vision encoder's input size
    pad: 0
    per_timestep: true
inference_steps: 10
timestep_scale: 1000.0
# train-time RTC (0 = off) -- same knobs as policy/diffusion.yaml
max_action_prefix: 0
prefix_conditioning_prob: 1.0
prefix_noise_scale: 0.05
