name: cooking_baseline_carrot
# Same physical store as cooking_baseline.yaml (../training_data) -- the
# carrot-instruction episodes were appended in place as new episode ids
# above cooking_baseline's, so this selection only adds a second `select`
# rule; the base 200 "cooking" episodes are the identical draw as
# cooking_baseline (same seed/task/count), not a copy.
store_path: ${oc.env:RGRL_DATA_ROOT,/home/hardware/code/erik/rgrl}/training_data
dataset_id: droid_cooking_local_v1
abs_action: false
rename: {}
# Base cooking draw (seed 42, same as cooking_baseline) + a seeded draw of
# 30 of the 31 raw "cooking - carrot" successes (see
# fetch_droid_language_stats.py). expected_sha256 pins the resolved set --
# run `python scripts/pin_selection.py data=cooking_baseline_carrot` to
# (re)compute it after any change.
selection:
  seed: 42
  select:
    - task: "cooking"
      count: 200
    - task: "cooking - carrot"
      count: 30
  expected_sha256: "822a21af691ad288c7d38056efd73f1e80f68ca2e0932b2df8fa4726e81a4407"
shape_meta:
  obs:
    wrist_image_left:
      shape: [180, 320, 3]
      type: rgb
      channel_order: rgb
    exterior_image_1_left:
      shape: [180, 320, 3]
      type: rgb
      channel_order: rgb
    joint_positions:
      shape: [7]
      type: low_dim
    gripper_position:
      shape: [1]
      type: low_dim
  action:
    shape: [8]
