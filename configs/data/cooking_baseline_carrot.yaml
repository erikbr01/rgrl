defaults:
  - cooking_baseline_store
  - _self_

name: cooking_baseline_carrot
# Base cooking draw (seed 42, same as cooking_baseline) + all 30 of the
# store's "cooking - carrot" episodes (31 raw successes, 30 survived
# conversion -- see fetch_droid_language_stats.py). count: 30 therefore takes
# the whole pool; the seed only orders it. expected_sha256 pins the resolved
# set -- run `python scripts/pin_selection.py data=cooking_baseline_carrot`
# to (re)compute it after any change.
selection:
  seed: 42
  select:
    - task: "cooking"
      count: 200
    - task: "cooking - carrot"
      count: 30
  expected_sha256: "822a21af691ad288c7d38056efd73f1e80f68ca2e0932b2df8fa4726e81a4407"
