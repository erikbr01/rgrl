name: set_table_baseline
# Rebuilt store (task-filtered + idle-trimmed by policy_graphs'
# trim_droid_idle_beginnings.py). The store physically carries all three
# DROID cameras, but this baseline trains on a single wrist camera
# (wrist_image_left) + the exterior view; shape_meta below selects the subset.
# The selection resolves to a zero-copy logical EpisodeView over the store.
store_path: ${oc.env:RGRL_DATA_ROOT,/mnt/ssdB/erik}/droid_converted_v2_trimmed
dataset_id: droid_v2_trimmed
abs_action: false
rename: {}
# Generative selection resolved against the store's tasks.json: a seed-42 draw
# of 60 "right" + 60 "middle". Success curation (unsuccessful->successful swaps)
# lives in the store's curation.json. Unlocked; add expected_sha256 (via
# `python scripts/pin_selection.py`) to pin the resolved set against silent drift.
selection:
  seed: 42
  select:
    - task: "prepare plate - milk right"
      count: 60
    - task: "prepare plate - milk middle"
      count: 60
  count: 120
shape_meta:
  obs:
    wrist_image_left:
      shape: [180, 320, 3]
      type: rgb
      channel_order: rgb
    exterior_image_1_left:
      shape: [180, 320, 3]
      type: rgb
      channel_order: rgb
    joint_positions:
      shape: [7]
      type: low_dim
    gripper_position:
      shape: [1]
      type: low_dim
  action:
    shape: [8]
