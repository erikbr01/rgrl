name: set_table_baseline
# Rebuilt store (all three cameras, incl. wrist_image_right -- right-eye
# decode of the wrist ZED via robo_dataset's `SERIAL:right` camera spec),
# task-filtered + idle-trimmed by policy_graphs' trim_droid_idle_beginnings.py.
# The selection manifest owns the seed-42 60-right + 60-middle baseline,
# success replacements, and provenance. It resolves to a zero-copy logical
# EpisodeView over this three-camera physical store.
store_path: ${oc.env:RGRL_DATA_ROOT,/mnt/ssdB/erik}/droid_converted_v2_trimmed
dataset_id: droid_v2_trimmed
abs_action: false
rename: {}
# Generative selection resolved against the store's tasks.json: a seed-42 draw
# of 60 "right" + 60 "middle". Success curation (unsuccessful->successful swaps)
# lives in the store's curation.json; expected_sha256 pins the resolved set.
selection:
  seed: 42
  select:
    - task: "prepare plate - milk right"
      count: 60
    - task: "prepare plate - milk middle"
      count: 60
  count: 120
  expected_sha256: "d0aae2abd2fa5334ad8a15bca18c00eb5fac1b7f1f58f1e5d248af193f8173bb"
shape_meta:
  obs:
    wrist_image_left:
      shape: [180, 320, 3]
      type: rgb
      channel_order: rgb
    wrist_image_right:
      shape: [180, 320, 3]
      type: rgb
      channel_order: rgb
    exterior_image_1_left:
      shape: [180, 320, 3]
      type: rgb
      channel_order: rgb
    joint_positions:
      shape: [7]
      type: low_dim
    gripper_position:
      shape: [1]
      type: low_dim
  action:
    shape: [8]
