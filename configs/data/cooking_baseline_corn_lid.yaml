defaults:
  - cooking_baseline_store
  - _self_

name: cooking_baseline_corn_lid
# Union of cooking_baseline_corn and cooking_baseline_lid: each variant rule
# uses the same seed/task/count as its single-variant config, so the 30 corn
# and 30 lid episodes here are the identical draws those configs resolve
# (per-task draws are independent -- see _resolve_selection), on top of the
# same base-200 "cooking" draw as cooking_baseline.
#
# Seeded draws of 30 from the store's 36 corn and 34 lid episodes.
# expected_sha256 pins the resolved set -- run
# `python scripts/pin_selection.py data=cooking_baseline_corn_lid` to
# (re)compute it after any change.
selection:
  seed: 42
  select:
    - task: "cooking"
      count: 200
    - task: "cooking - corn"
      count: 30
    - task: "cooking - lid"
      count: 30
  expected_sha256: "01921ea9d4938f014f6e3d9c3128b97497b205de6fe8cc2311e79e3e2da7abdc"
