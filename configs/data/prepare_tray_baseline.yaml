name: prepare_tray_baseline
store_path: ${oc.env:RGRL_HOME_DATA_ROOT,/home/erbauer}/policy_graphs/data/droid_converted_prepare_tray_trimmed
dataset_id: droid_prepare_tray_trimmed
abs_action: false
rename: {}
# Fixed, reproducible 120-episode logical view: 60 prepare-tray-top and
# 60 prepare-tray-bottom episodes. The versioned manifest owns IDs and
# provenance; cache creation links this physical store without re-encoding.
# Generative selection resolved against the store's tasks.json: a seed-42 draw
# of 60 "top" + 60 "bottom" (diffusion_policy's original episodes_per_task draw
# used the same default_rng(42).choice contract, so this reproduces it exactly).
# No success curation for this dataset.
selection:
  seed: 42
  select:
    - task: "prepare tray - top"
      count: 60
    - task: "prepare tray - bottom"
      count: 60
  count: 120
shape_meta:
  obs:
    wrist_image_left:
      shape: [180, 320, 3]
      type: rgb
      channel_order: rgb
    wrist_image_right:
      shape: [180, 320, 3]
      type: rgb
      channel_order: rgb
    exterior_image_1_left:
      shape: [180, 320, 3]
      type: rgb
      channel_order: rgb
    joint_positions:
      shape: [7]
      type: low_dim
    gripper_position:
      shape: [1]
      type: low_dim
  action:
    shape: [8]
