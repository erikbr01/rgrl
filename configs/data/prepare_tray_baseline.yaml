name: prepare_tray_baseline
store_path: ${oc.env:RGRL_DATA_ROOT,/mnt/ssdB/erik}/droid_converted_prepare_tray_all_trimmed
dataset_id: droid_prepare_tray_all_trimmed
abs_action: false
rename: {}
# Fixed, reproducible 120-episode logical view: 60 prepare-tray-top and
# 60 prepare-tray-bottom episodes. Resolved against the full prepare_tray store
# (droid_converted_prepare_tray_all_trimmed: all dates, 127 top + 136 bottom)
# via a seed-42 draw. Listing a task a second time in a plus-config continues
# this same seeded draw without replacement, so baseline IDs are a strict
# subset of prepare_tray_plustop / prepare_tray_plusbottom. No success curation.
selection:
  seed: 42
  select:
    - task: "prepare tray - top"
      count: 60
    - task: "prepare tray - bottom"
      count: 60
  count: 120
  expected_sha256: "bde545933d43bcaefe92d477bb99fc6093ebee90a8d109be60f4eef6f2b79b3d"
shape_meta:
