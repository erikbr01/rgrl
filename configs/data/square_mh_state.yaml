name: square_mh_lowdim
path: ${oc.env:RGRL_DATA_ROOT,/mnt/ssdB/erik}/cupid_data/robomimic/datasets/square/mh/low_dim_v15.hdf5
abs_action: false
rename: {}
# The hdf5's own env_args were recorded with robosuite 1.5.1 (nested "BASIC"
# controller config + lite_physics kwarg) -- incompatible with this repo's
# robosuite==1.4.1 pin. Override with the equivalent flat OSC_POSE config
# (same schema already validated working for transport_mh's eval env).
env_meta:
  env_name: NutAssemblySquare
  type: 1
  env_kwargs:
    has_renderer: false
    has_offscreen_renderer: false
    ignore_done: true
    use_object_obs: true
    use_camera_obs: false
    control_freq: 20
    controller_configs:
      type: OSC_POSE
      input_max: 1
      input_min: -1
      output_max: [0.05, 0.05, 0.05, 0.5, 0.5, 0.5]
      output_min: [-0.05, -0.05, -0.05, -0.5, -0.5, -0.5]
      kp: 150
      damping: 1
      impedance_mode: fixed
      kp_limits: [0, 300]
      damping_limits: [0, 10]
      position_limits: null
      orientation_limits: null
      uncouple_pos_ori: true
      control_delta: true
      interpolation: null
      ramp_ratio: 0.2
    robots: [Panda]
    camera_depths: false
    camera_heights: 84
    camera_widths: 84
    reward_shaping: false
shape_meta:
  obs:
    object:
      shape: [14]
      type: low_dim
    robot0_eef_pos:
      shape: [3]
      type: low_dim
    robot0_eef_quat:
      shape: [4]
      type: low_dim
      quat_convention: xyzw
    robot0_gripper_qpos:
      shape: [2]
      type: low_dim
  action:
    shape: [7]
