defaults:
  - cooking_baseline_store
  - _self_

name: cooking_baseline_carrot_lid
# Union of cooking_baseline_carrot and cooking_baseline_lid: each variant rule
# uses the same seed/task/count as its single-variant config, so the 30 carrot
# and 30 lid episodes here are the identical draws those configs resolve
# (per-task draws are independent -- see _resolve_selection), on top of the
# same base-200 "cooking" draw as cooking_baseline.
#
# carrot's 30 is the whole pool; lid is a seeded 30 of the store's 34.
# expected_sha256 pins the resolved set -- run
# `python scripts/pin_selection.py data=cooking_baseline_carrot_lid` to
# (re)compute it after any change.
selection:
  seed: 42
  select:
    - task: "cooking"
      count: 200
    - task: "cooking - carrot"
      count: 30
    - task: "cooking - lid"
      count: 30
  expected_sha256: "8950903e543c19e49cda4eef6a78d6341020bfbdd2360536c8c9f26c1093cf11"
