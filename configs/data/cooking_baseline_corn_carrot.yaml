defaults:
  - cooking_baseline_store
  - _self_

name: cooking_baseline_corn_carrot
# Union of cooking_baseline_corn and cooking_baseline_carrot: each variant
# rule uses the same seed/task/count as its single-variant config, so the 30
# corn and 30 carrot episodes here are the identical draws those configs
# resolve (per-task draws are independent -- see _resolve_selection), on top
# of the same base-200 "cooking" draw as cooking_baseline.
#
# corn is a seeded 30 of the store's 36; carrot's 30 is the whole pool.
# expected_sha256 pins the resolved set -- run
# `python scripts/pin_selection.py data=cooking_baseline_corn_carrot` to
# (re)compute it after any change.
selection:
  seed: 42
  select:
    - task: "cooking"
      count: 200
    - task: "cooking - corn"
      count: 30
    - task: "cooking - carrot"
      count: 30
  expected_sha256: "cda30f60fae694273c90a56d22f41f95ab5d20b5501402717819d6eae45df486"
