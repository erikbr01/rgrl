defaults:
  - _base/cooking_store@_here_
  - _self_

name: cooking_baseline
# Seed-42 draw of 200 of the 201 successful "cooking" episodes (203 raw ->
# 201 after --skip-corrupt). expected_sha256 pins the resolved episode-id set
# against silent drift; run
# `python scripts/pin_selection.py data=cooking_baseline` to (re)compute it.
selection:
  seed: 42
  select:
    - task: "cooking"
      count: 200
  count: 200
  expected_sha256: "68e27c6ebad1b6d2230d0c6e41bfb1d9eae95fc54f04c969dca20e2285ec46cf"
