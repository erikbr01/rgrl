name: cooking_baseline_lid
# Same physical store as cooking_baseline.yaml (../training_data) -- the
# lid-instruction episodes were appended in place as new episode ids
# above cooking_baseline's, so this selection only adds a second `select`
# rule; the base 200 "cooking" episodes are the identical draw as
# cooking_baseline (same seed/task/count), not a copy.
store_path: ${oc.env:RGRL_DATA_ROOT,/home/hardware/code/erik/rgrl}/training_data
dataset_id: droid_cooking_local_v1
abs_action: false
rename: {}
# Base cooking draw (seed 42, same as cooking_baseline) + a seeded draw of
# 30 of the 34 raw "cooking - lid" successes (see
# fetch_droid_language_stats.py). expected_sha256 pins the resolved set --
# run `python scripts/pin_selection.py data=cooking_baseline_lid` to
# (re)compute it after any change.
selection:
  seed: 42
  select:
    - task: "cooking"
      count: 200
    - task: "cooking - lid"
      count: 30
  expected_sha256: "c1e354f0d8c6bc695a23e18211f0caa05e8b0bc9614932c473989b52812e21fd"
shape_meta:
  obs:
    wrist_image_left:
      shape: [180, 320, 3]
      type: rgb
      channel_order: rgb
    exterior_image_1_left:
      shape: [180, 320, 3]
      type: rgb
      channel_order: rgb
    joint_positions:
      shape: [7]
      type: low_dim
    gripper_position:
      shape: [1]
      type: low_dim
  action:
    shape: [8]
