# @package _global_
# set_table baseline + 60 disjoint middle episodes; 450k steps (training/droid_plus).
defaults:
  - override /data: set_table_plusmiddle
  - override /target: set_table_baseline
  - override /policy: dit_flow_droid
  - override /training: droid_plus

training:
  wandb_project: set-table-droid
  wandb_name: set_table_plusmiddle_dit
  # batch 256 (same as prepare_tray); fits a 24GB 4090 now that the DROID
  # recipe keeps the store in host RAM (training/droid data_mode=shared_memory).
  batch_size: 256

out: runs/set_table_plusmiddle_dit
