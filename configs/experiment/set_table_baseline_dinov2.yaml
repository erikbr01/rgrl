# @package _global_
# set_table baseline with a DINOv2 ViT-S/14 backbone (timm), pretrained +
# ImageNet norm. Same data/target/recipe as set_table_baseline; only the vision
# encoder differs, so it is a like-for-like backbone ablation.
defaults:
  - override /data: set_table_baseline
  - override /target: set_table_baseline
  - override /policy: dit_flow_droid_dinov2
  - override /training: droid

training:
  wandb_project: set-table-droid
  wandb_name: set_table_baseline_dinov2_dit
  # 64: two fine-tuned ViT-S/14 backbones at 224x224 OOM a 24GB 4090 at 128/256.
  # Run with data_mode=shared_memory + PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True;
  # for a larger batch, freeze the backbone (policy.frozen_backbone=true).
  batch_size: 64

out: runs/set_table_baseline_dinov2_dit
