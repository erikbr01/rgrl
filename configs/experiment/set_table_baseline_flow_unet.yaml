# @package _global_
# set_table baseline with a UNet + rectified-flow head (vs the DiT-flow
# baseline), pretrained ResNet18 + ImageNet norm. Same data/target/recipe as
# set_table_baseline; only the denoiser architecture differs, so paired with
# set_table_baseline_pretrained_dit it isolates UNet-vs-DiT at a fixed
# (flow) objective.
defaults:
  - override /data: set_table_baseline
  - override /target: set_table_baseline
  - override /policy: flow_droid
  - override /training: droid

training:
  wandb_project: set-table-droid
  wandb_name: set_table_baseline_flow_unet

out: runs/set_table_baseline_flow_unet
