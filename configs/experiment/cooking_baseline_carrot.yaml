# @package _global_
# cooking baseline + 30 "cooking - carrot" episodes, single-wrist DROID DiT
# flow, 300k steps (training/droid_disk). Same recipe as cooking_baseline.yaml
# except data: cooking_baseline_carrot (target's shape_meta is unchanged, so
# it still points at the shared cooking_baseline target config).
defaults:
  - override /data: cooking_baseline_carrot
  - override /target: cooking_baseline
  - override /policy: dit_flow_droid
  - override /training: droid_disk

training:
  wandb_project: cooking-droid
  wandb_name: cooking_baseline_carrot_dit_local_disk
  batch_size: 256
  # 230 episodes vs the 200-episode baseline (+15%) -- scale steps to match
  # (300k * 1.15 ~= 345k, rounded to 350k).
  steps: 350000

out: runs/cooking_baseline_carrot_dit_local_disk
