# @package _global_
# cooking baseline: single-wrist DROID DiT flow, 300k steps (training/droid_disk).
# Cooking episodes are longer than prepare_tray/set_table, so the baseline was
# under-trained at 300k; continue to 450k with resume=extend (see README/PR).
defaults:
  - override /data: cooking_baseline
  - override /target: cooking_baseline
  - override /policy: dit_flow_droid
  - override /training: droid_disk

training:
  wandb_project: cooking-droid
  wandb_name: cooking_baseline_dit_local_disk
  # The 200-episode/2-camera cooking store is ~50GB uncompressed -- bigger
  # than both this box's 30GB host RAM and its GPU's 32GB VRAM, so neither
  # cuda_resident nor shared_memory (the droid.yaml default) can hold it
  # resident. training/droid_disk overrides data_mode to stream/decode from
  # disk per sample instead (see rgrl/dataset.py's DiskSequenceDataset) with
  # dataloader_workers/prefetch_factor cranked up to hide that latency.
  # batch 256 (same as prepare_tray) -- data residency no longer competes
  # with activations for VRAM once the store isn't cuda_resident/shared_memory.
  batch_size: 256

# runs/cooking_baseline_dit already holds an earlier baseline's checkpoints
# (a different store/data_mode) -- this run name keeps that lineage
# untouched rather than colliding with it.
out: runs/cooking_baseline_dit_local_disk
