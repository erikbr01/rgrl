# Non-privileged ToolHang image policy: two cameras plus robot proprioception.
# Deliberately excludes the simulator-only `object` observation.
obs:
  sideview_image:
    shape: [84, 84, 3]
    type: rgb
    channel_order: rgb
  robot0_eye_in_hand_image:
    shape: [84, 84, 3]
    type: rgb
    channel_order: rgb
  robot0_eef_pos:
    shape: [3]
    type: low_dim
  robot0_eef_quat:
    shape: [4]
    type: low_dim
    quat_convention: xyzw
  robot0_gripper_qpos:
    shape: [2]
    type: low_dim
action:
  shape: [7]
