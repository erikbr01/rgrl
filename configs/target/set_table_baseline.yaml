# Matches configs/data/set_table_baseline.yaml's source shape_meta exactly
# -- droid_converted only has these two cameras, so no conversion/trimming
# happens (see rgrl/conversion.py for what happens when it does).
obs:
  wrist_image_left:
    shape: [180, 320, 3]
    type: rgb
    channel_order: rgb
  exterior_image_1_left:
    shape: [180, 320, 3]
    type: rgb
    channel_order: rgb
  joint_positions:
    shape: [7]
    type: low_dim
  gripper_position:
    shape: [1]
    type: low_dim
action:
  shape: [8]
