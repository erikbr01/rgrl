# Single wrist camera (wrist_image_left) + the exterior view. The store also
# carries wrist_image_right (see policy_graphs/docs/droid_workflow.md's camera
# table), but the baseline does not train on it.
obs:
  wrist_image_left:
    shape: [180, 320, 3]
    type: rgb
    channel_order: rgb
  exterior_image_1_left:
    shape: [180, 320, 3]
    type: rgb
    channel_order: rgb
  joint_positions:
    shape: [7]
    type: low_dim
  gripper_position:
    shape: [1]
    type: low_dim
action:
  shape: [8]
