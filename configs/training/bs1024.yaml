# Big-batch recipe: 4x fatter kernels lift SM occupancy (the train loop's
# actual utilization limiter -- see rgrl/train_loop.py's module docstring),
# measured 1.81x higher steady-state sample throughput on ToolHang flow
# (42.3k versus 23.4k samples/s) with equal-or-better historical
# quality (tool_hang sync: 0.94 vs 0.86 at the bs=256 baseline; linear lr
# scaling edged out sqrt, 0.94 vs 0.92). The sample budget makes the
# equal-training-data comparison explicit instead of requiring hand-divided
# step counts. Validated on lowdim;
# check memory headroom before using with image observations.
defaults:
  - default
  - _self_

batch_size: 1024
lr: 4.0e-4
steps: null
train_samples: 7680000
warmup_samples: 128000
log_every_samples: 25600
val_every_samples: 512000
save_every_samples: 2560000
