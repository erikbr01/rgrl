# Full sim-bottles recipe: all 2438 demos, 100k steps.
#
# The conversion cache holds the camera at 168x224 (target/sim_bottles.yaml).
# All 2438 episodes is 2,228,979 frames = ~252GB uncompressed, well past host
# RAM, so the split streams from disk. That is affordable here precisely because
# the stored frames are already the policy's working resolution -- the earlier
# data_mode=disk run was data-bound (72-76% of step time) only because it was
# decoding native 480x640 and shrinking on GPU.
#
# max_decoders is PER WORKER PROCESS, so the budget is per-worker, not global:
# 2500 x 8 workers would authorize ~20k live torchcodec decoders (each an ffmpeg
# context + fd over a ~500MB file), which video.py records as failing with
# "Resource temporarily unavailable" well below that.
defaults:
  - default
  - _self_

batch_size: 256
data_mode: disk
dataloader_workers: 8
prefetch_factor: 3
max_decoders: 300
steps: 100000
save_every: 25000
val_every: 10000
compile_mode: default
max_grad_norm: 10.0

# cuDNN conv autotuning is THE source of run-to-run nondeterminism on this stack:
# measured A/B, cudnn_benchmark=true diverges from an identical run by step ~325,
# while false is bit-identical over every logged point (deterministic=true + no
# compile is also reproducible but costs much more). Off by default here so any
# numerical failure in these runs can actually be reproduced and bisected.
cudnn_benchmark: false
