# DROID DiT flow recipe (set_table / prepare_tray baselines).
#
# data_mode shared_memory: keep the store in host RAM (CPU/shared-host gathers
# with pinned H2D on a side stream, single producer thread -- workers=0 beats
# multiprocessing for large image batches: IPC/contention). This is the DROID
# default rather than `auto` because auto would cache a store that fits fully
# on the GPU (cuda_resident), which eats ~15 GB VRAM for the larger stores and
# leaves no room for batch 256 -- keeping the store off-GPU is what lets batch
# 256 fit a 24 GB 4090 at two cameras. The old resident-only ceiling was batch
# 128; experiments now set batch_size: 256 (see the prepare_tray/set_table
# experiment configs). 300k optimizer steps is the baseline budget; save every
# 100k. lr stays the default 1e-4.
defaults:
  - default
  - _self_

batch_size: 128
data_mode: shared_memory
dataloader_workers: 0
steps: 300000
save_every: 100000
# compile_mode default (the mode every DROID run has used). Overrides the repo
# default of max-autotune, whose autotuning phase spikes GPU memory on top of
# steady-state and OOMs above ~batch 64 on DROID's large images -- it was only
# ever validated on small-image ToolHang.
compile_mode: default
# compile_mode: max-autotune   # ~5% faster steady-state, but OOMs at DROID batch sizes
