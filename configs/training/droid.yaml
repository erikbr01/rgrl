# DROID DiT flow recipe (set_table / prepare_tray baselines).
#
# Small batch because the observations are large multi-camera images; the data
# path is auto (CPU/shared-host gathers with pinned H2D on a side stream) with
# a single producer thread -- workers=0 beats multiprocessing large image
# batches (IPC/contention). 300k optimizer steps is the baseline budget over
# 120 episodes; save a checkpoint every 100k.
defaults:
  - default
  - _self_

batch_size: 64
data_mode: auto
dataloader_workers: 0
steps: 300000
save_every: 100000
