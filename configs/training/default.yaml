_target_: rgrl.train_loop.TrainConfig
# Length and all cadences are in optimizer steps (gradient updates).
steps: 30000
batch_size: 256
lr: 1.0e-4
weight_decay: 1.0e-6
betas: [0.95, 0.999]
warmup_steps: 500
seed: 0
val_seed: 17029
val_episodes: 4
val_every: 2000
log_every: 100
save_every: 10000
resume: auto
resume_allow_legacy: false
resume_ignore_fingerprint: false
pin_fallback_gb: 20.0
dataloader_workers: 0
data_mode: auto
prefetch_factor: 4
max_decoders: 450
device_memory_reserve_gb: 4.0
compile: true
# compile_mode: default        # previous default (fast compile, no autotuning)
# max-autotune: ~5% faster steady-state steps (measured, image DiT) for a
# longer one-time compile. Options: default | reduce-overhead |
# max-autotune | max-autotune-no-cudagraphs. Training-only; inference compile
# is configured separately and unaffected.
compile_mode: max-autotune
bf16: true
max_grad_norm: null
cudnn_benchmark: true
deterministic: false
# Optimization diagnostics -> <out>/diagnostics.jsonl (see rgrl/diagnostics.py,
# summarize with scripts/summarize_diagnostics.py). diag_every: null follows
# log_every; 0 keeps only the cheap per-step global norms.
grad_diag: true
diag_every: null
diag_spike_factor: 4.0
ema_power: 0.75
device: cuda
wandb_project: null
wandb_name: null
profile: true
trace_steps: 0
