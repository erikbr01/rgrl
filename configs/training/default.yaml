_target_: rgrl.train_loop.TrainConfig
# Length and all cadences are in optimizer steps (gradient updates).
steps: 30000
batch_size: 256
lr: 1.0e-4
weight_decay: 1.0e-6
betas: [0.95, 0.999]
warmup_steps: 500
seed: 0
val_seed: 17029
val_episodes: 4
# tail | random -- which episodes are held out. tail (the historical default)
# takes the last val_episodes, which is stable under store growth but ties the
# val set to episode id: if a selection appends a distinct subpopulation at the
# high ids, the entire val set comes from it. Use random there.
val_selection: tail
val_every: 2000
log_every: 100
save_every: 10000
resume: auto
resume_allow_legacy: false
resume_ignore_fingerprint: false
pin_fallback_gb: 20.0
dataloader_workers: 0
data_mode: auto
prefetch_factor: 4
max_decoders: 450
device_memory_reserve_gb: 4.0
compile: true
# compile_mode: default        # previous default (fast compile, no autotuning)
# max-autotune: ~5% faster steady-state steps (measured, image DiT) for a
# longer one-time compile. Options: default | reduce-overhead |
# max-autotune | max-autotune-no-cudagraphs. Training-only; inference compile
# is configured separately and unaffected.
compile_mode: max-autotune
bf16: true
# Post-warmup LR shape: cosine (decay to 0) | constant (ABC's reference recipe).
lr_schedule: cosine
max_grad_norm: null
cudnn_benchmark: true
deterministic: false
ema_power: 0.75
device: cuda
wandb_project: null
wandb_name: null
profile: true
trace_steps: 0
