defaults:
  - data: lift_state
  - policy: diffusion
  - training: default
  - override hydra/job_logging: none
  - _self_

# keep cwd at the invocation dir — everything (store paths, out) is relative
# to it, and hydra's default chdir-per-run would silently break that. Job
# logging (hydra's own <job_name>.log file handler) is disabled: it would
# otherwise write to the cwd too, colliding with rgrl's own train.log/eval.log
# inside the run's out dir (see rgrl/logutil.py).
hydra:
  job:
    chdir: false
  output_subdir: null
  run:
    dir: .

out: runs/dev
