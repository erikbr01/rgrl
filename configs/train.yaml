defaults:
  - data: lift_state
  - target: lift_state
  - policy: flow
  - training: default
  - sampling: uniform
  - override hydra/job_logging: none
  - override hydra/hydra_logging: none
  - _self_

# keep cwd at the invocation dir — everything (store paths, out) is relative
# to it, and hydra's default chdir-per-run would silently break that. Both of
# hydra's own logging config groups are disabled: job_logging's file handler
# would write to cwd, colliding with rgrl's own train.log/eval.log inside the
# run's out dir, and hydra_logging attaches its own root console handler,
# which would print every rgrl.* log record a second time via propagation
# (rgrl/logutil.py already owns console output via the "rgrl" logger).
hydra:
  job:
    chdir: false
  output_subdir: null
  run:
    dir: .

out: runs/dev

# Processes used to fit normalizer stats on a cache miss (one-time conversion).
# The single source for this knob. Deliberately top-level, not under `data`:
# it's an orchestration knob, so it must not enter the conversion cache hash.
# null -> one process per key, capped at the CPU count.
stats_workers: null
