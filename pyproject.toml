[project]
name = "rgrl"
version = "0.1.0"
description = "Really good robot learning: minimal, blazing-fast imitation learning."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.7",
    "torchvision>=0.22",
    "numpy>=1.26",
    "h5py>=3.10",
    "tyro>=0.9",
    "hydra-core>=1.3",
    "tqdm>=4.66",
    "robo_dataset",
    "timm>=1.0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.12",
]
wandb = ["wandb>=0.17"]
eval = [
    "robosuite==1.4.1",
    # robosuite 1.4.1's OSC controller breaks against mujoco >= 3 (mj_fullM
    # signature change); 2.3.7 is the newest compatible release
    "mujoco==2.3.7",
    # Used to select an EGL device for headless image rollouts. The runtime
    # talks directly to Robosuite and declares this dependency explicitly.
    "egl-probe==1.0.2",
    "imageio[ffmpeg]>=2.34",
    # policy-server client: rgrl/inference/policy_client.py's HttpPolicy.
    # Deliberately not torch/fastapi — an env-only box never needs the
    # policy's venv, only this.
    "requests>=2.31",
]
# For the policy-serving box (rgrl/inference/policy_server.py) — never needed
# on an env-only box (robosuite/mujoco, or a real robot), which is
# the whole point of the HTTP split.
serve = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
]
video = [
    "av>=12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rgrl"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Start with correctness checks that can be enforced on the existing research
# codebase without a repository-wide formatting rewrite.
select = ["E9", "F63", "F7", "F82"]

[tool.uv]
# robosuite 1.4.1 (needed for robomimic v0.3-era datasets) has old metadata.
# Keep the core env resolvable without the eval extra.

# Keep the CUDA wheel source explicit so local training and CI resolve the
# same Torch build family. The current benchmark host is an RTX 4090; cu128
# wheels remain backward-compatible with it.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]
# vendored as a git submodule (third_party/robo_dataset), not copied in — stays
# a standalone repo at github.com:erikbr01/robo_dataset
robo_dataset = { path = "third_party/robo_dataset", editable = true }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
