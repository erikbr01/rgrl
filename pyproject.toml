[project]
name = "rgrl"
version = "0.1.0"
description = "Really good robot learning: minimal, blazing-fast imitation learning."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.7",
    "torchvision>=0.22",
    "numpy>=1.26",
    "h5py>=3.10",
    "tyro>=0.9",
    "hydra-core>=1.3",
    "tqdm>=4.66",
    "robo_dataset",
]

[project.optional-dependencies]
wandb = ["wandb>=0.17"]
eval = [
    "robomimic==0.3.0",
    "robosuite==1.4.1",
    # robosuite 1.4.1's OSC controller breaks against mujoco >= 3 (mj_fullM
    # signature change); 2.3.7 is the newest compatible release
    "mujoco==2.3.7",
    "imageio[ffmpeg]>=2.34",
    # policy-server client: rgrl/inference/policy_client.py's HttpPolicy.
    # Deliberately not torch/fastapi — an env-only box never needs the
    # policy's venv, only this.
    "requests>=2.31",
]
# For the policy-serving box (rgrl/inference/policy_server.py) — never needed
# on an env-only box (robomimic/robosuite/mujoco, or a real robot), which is
# the whole point of the HTTP split.
serve = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rgrl"]

[tool.uv]
# robosuite 1.4.1 (needed for robomimic v0.3-era datasets) has old metadata.
# Keep the core env resolvable without the eval extra.

# cu126 wheels: newest CUDA that runs on this machine's 555 driver (CUDA 12.5;
# 12.x wheels are minor-version compatible with driver >= 525).
[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
torchvision = [{ index = "pytorch-cu126" }]
# vendored as a git submodule (third_party/robo_dataset), not copied in — stays
# a standalone repo at github.com:erikbr01/robo_dataset
robo_dataset = { path = "third_party/robo_dataset", editable = true }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
