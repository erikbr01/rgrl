[project]
name = "rgrl"
version = "0.1.0"
description = "Really good robot learning: minimal, blazing-fast imitation learning."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.13",
    "torchvision>=0.28",
    "numpy>=1.26",
    "h5py>=3.10",
    "tyro>=0.9",
    "hydra-core>=1.3",
    "tqdm>=4.66",
    "robo_dataset",
]

[project.optional-dependencies]
wandb = ["wandb>=0.17"]
eval = [
    # robomimic 0.5.0 (robosuite 1.5 support) is git-only, not on PyPI — pinned
    # via [tool.uv.sources] below to the exact commit the v15 data was validated on.
    "robomimic",
    "robosuite==1.5.1",
    # robosuite 1.5.1 requires mujoco 3.x; 3.9.0 matches the stack the v15
    # (env_version 1.5.1) datasets were generated/validated with.
    "mujoco==3.9.0",
    "imageio[ffmpeg]>=2.34",
    # policy-server client: rgrl/inference/policy_client.py's HttpPolicy.
    # Deliberately not torch/fastapi — an env-only box never needs the
    # policy's venv, only this.
    "requests>=2.31",
]
# For the policy-serving box (rgrl/inference/policy_server.py) — never needed
# on an env-only box (robomimic/robosuite/mujoco, or a real robot), which is
# the whole point of the HTTP split.
serve = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
]
video = [
    "av>=12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rgrl"]

[tool.uv]
# robosuite 1.4.1 (needed for robomimic v0.3-era datasets) has old metadata.
# Keep the core env resolvable without the eval extra.

# cu126 wheels: the newest torch (2.13+) is published on the cu126 index and
# runs fine on this machine's driver + GPU; the cu128 index lags (tops out at
# torch 2.11), so cu126 is actually the newer torch. Keep training on cu126.
[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
torchvision = [{ index = "pytorch-cu126" }]
# vendored as a git submodule (third_party/robo_dataset), not copied in — stays
# a standalone repo at github.com:erikbr01/robo_dataset
robo_dataset = { path = "third_party/robo_dataset", editable = true }
# robomimic 0.5.0 is not published to PyPI; use the ARISE-Initiative git commit
# that ships robosuite-1.5 support (matches the OGPO/v15 stack).
robomimic = { git = "https://github.com/ARISE-Initiative/robomimic.git", rev = "e10526b9a40c78b41f1e37e60041dc0ec0a5f60f" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
