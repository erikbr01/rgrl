name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve private submodule revision
        id: robo_dataset
        run: echo "sha=$(git rev-parse HEAD:third_party/robo_dataset)" >> "$GITHUB_OUTPUT"
      - name: Require private submodule access
        env:
          ROBO_DATASET_TOKEN: ${{ secrets.ROBO_DATASET_TOKEN }}
        run: |
          if [ -z "$ROBO_DATASET_TOKEN" ]; then
            echo "::error::Set the ROBO_DATASET_TOKEN repository secret to a read-only token with access to erikbr01/robo_dataset."
            exit 1
          fi
      - name: Check out robo_dataset
        uses: actions/checkout@v4
        with:
          repository: erikbr01/robo_dataset
          ref: ${{ steps.robo_dataset.outputs.sha }}
          path: third_party/robo_dataset
          token: ${{ secrets.ROBO_DATASET_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install uv
      - name: Install project
        run: uv sync --extra dev
      - name: Static correctness checks
        run: uv run ruff check .
      - name: Unit tests
        run: uv run pytest tests third_party/robo_dataset/tests -q
